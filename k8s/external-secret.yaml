# Syncs credentials from Google Secret Manager into a Kubernetes Secret using the
# External Secrets Operator. Rotate a secret in Secret Manager and the pod picks it up
# on its next restart; no one ever pastes a credential into a manifest.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wfm-integration-hub-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: wfm-integration-hub-secrets
  data:
    - { secretKey: WFM_BASE_URL, remoteRef: { key: wfm-base-url } }
    - { secretKey: WFM_API_TOKEN, remoteRef: { key: wfm-api-token } }
    - { secretKey: PAYROLL_WEBHOOK_URL, remoteRef: { key: payroll-webhook-url } }
    - { secretKey: PAYROLL_SIGNING_SECRET, remoteRef: { key: payroll-signing-secret } }
    - { secretKey: ADMIN_TOKEN, remoteRef: { key: wfm-hub-admin-token } }
