name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t wfm-integration-hub:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name hub -p 8080:8080 \
            -e WFM_BASE_URL=http://127.0.0.1:9 -e WFM_API_TOKEN=x \
            -e PAYROLL_WEBHOOK_URL=http://127.0.0.1:9 -e PAYROLL_SIGNING_SECRET=ci-signing-secret-123 \
            -e ADMIN_TOKEN=ci-admin-token-123456 -e SYNC_INTERVAL_SECONDS=0 \
            wfm-integration-hub:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs hub; exit 1
